<div>
  <p><b>Required:</b> Docker-style image name in the project registry.</p>
  <p>Lowercase <code>a-z</code>, digits, <code>.</code> <code>_</code> <code>-</code>, optional <code>/</code> segments. No spaces or wildcards.</p>
  <p><b>Examples:</b></p>
  <div class="gri-help-nested">
    <code>document-management-service</code><br/>
    <code>group/app</code>
  </div>
</div>
