<div>
  <p><b>Optional:</b> how to sort fetched tags before applying <code>maxRows</code>.</p>
  <p>Allowed values:</p>
  <div class="gri-help-nested">
    <ul>
      <li><code>NONE</code> — GitLab order (default)</li>
      <li><code>ASC</code> / <code>DESC</code> — lexicographic</li>
      <li><code>ASC_SMART</code> / <code>DESC_SMART</code> — numeric-aware (e.g. <code>v1.2.10</code> &gt; <code>v1.2.9</code>)</li>
    </ul>
  </div>
  <p><b>Example:</b></p>
  <div class="gri-help-nested">
    <code>DESC_SMART</code>
  </div>
</div>
